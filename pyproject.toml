[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-tales-local-server"
version = "0.1.0"
description = "Experimental single-guest local server for the Guardian Tales 3.57.0 Android client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = ["black==26.10.1", "ruff==0.17.5"]
panel-art = ["UnityPy>=1.25.4,<2", "xxhash>=3.5,<5"]
raid-custom = ["xxhash>=3.5,<5"]
hero-trials = ["xxhash>=3.5,<5", "cryptography>=46,<49"]

[project.scripts]
gt-local = "guardian_tales.__main__:main"

[project.urls]
Repository = "https://github.com/yagoaresarmesto/guardian-tales-local-server"
Issues = "https://github.com/yagoaresarmesto/guardian-tales-local-server/issues"

[tool.setuptools.packages.find]
include = ["guardian_tales*"]

[tool.setuptools.package-data]
guardian_tales = ["templates/*.json", "templates/*.lua"]
"guardian_tales.inventory_panel" = ["static/*/*.html", "static/*/*.css", "static/*/*.js"]
"guardian_tales.web_panel" = ["*/*.html", "*/*.css", "*/*.js"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
