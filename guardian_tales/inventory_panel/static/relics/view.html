  <main>
    <div class="title-row"><h1>Inventory</h1><span class="temporary">Game save · server.sqlite3</span></div>
    <p class="save-access" id="access" role="status">Checking game save access…</p>
    <div class="workspace">
      <section class="inspector" aria-labelledby="details-title">
        <div class="section-bar"><h2 id="details-title">Relic details</h2><div class="copy-actions"><span id="copy-id"></span>
          <button type="button" id="copy-protection" aria-describedby="access" hidden disabled>Lock</button>
          <button type="button" class="delete-copy-button" id="delete-copy" aria-haspopup="dialog" hidden>Delete</button></div></div>
        <div id="placeholder"><img src="/type-icon/inventory.png" alt=""><p>Select a relic to see its options.</p></div>
        <div id="detail" hidden>
          <div class="item-identity">
            <div class="hero-art" id="portrait"></div>
            <div><div class="identity-meta" id="family"></div><h3 id="name"></h3><div class="hero-stars" id="stars"></div></div>
          </div>
          <dl class="inspector-facts">
            <div class="fact"><dt>Equipped</dt><dd id="equipped"></dd></div>
            <div class="fact"><dt>Protection</dt><dd id="protection"></dd></div>
            <div class="fact"><dt>Jewels</dt><dd id="jewels"></dd></div>
          </dl>
          <form class="inspector-editor" id="editor">
            <section aria-labelledby="basic-heading">
              <h4 id="basic-heading">Basic options</h4><div class="option-group" id="basic"></div>
            </section>
            <section aria-labelledby="sub-heading">
              <h4 id="sub-heading">Sub-options</h4><div class="option-group" id="slots"></div>
              <p id="unavailable" class="editor-note" hidden></p>
            </section>
            <footer class="inspector-actions">
              <button id="save" class="apply-button" type="submit" aria-describedby="access" disabled>Apply</button>
            </footer>
          </form>
        </div>
      </section>
      <section class="collection" aria-labelledby="collection-heading">
        <header class="collection-bar"><h2 id="collection-heading">Relics</h2>
          <button type="button" id="bulk-toggle" aria-pressed="false" aria-controls="bulk-toolbar" hidden>Select items</button>
          <button type="button" id="open-relics-catalog" class="open-item-catalog" aria-haspopup="dialog" disabled>Add relic</button>
        </header>
        <div class="collection-body"><div class="rack">
          <div class="tools"><label class="search"><span class="search-icon" aria-hidden="true"></span><input type="search" id="search" aria-label="Search relics by name or ID" placeholder="Search by name or ID"></label>
            <label class="sort">Show <select id="show"><option value="all">All relics</option><option value="imbued">With sub-options</option><option value="empty">Without sub-options</option><option value="equipped">Equipped</option></select></label>
          </div>
          <label class="mobile-types">Relic type <select id="mobile-types"></select></label>
          <div id="tiles" role="group" aria-label="Relic copies"></div>
          <p id="empty" hidden>No relics match these filters.</p>
          <footer class="pager"><span id="range" aria-live="polite">Loading relics…</span><button type="button" id="prev" aria-label="Previous page" disabled>‹</button><button type="button" id="next" aria-label="Next page" disabled>›</button></footer>
        </div><aside class="types"><h3>Relic type</h3><div id="types" role="group" aria-label="Relic type"></div></aside></div>
        <p id="error" role="alert" hidden></p>
      </section>
    </div>
    <p id="message" role="status" hidden></p>
  </main>
