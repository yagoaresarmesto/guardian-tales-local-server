  <main>
    <header class="mastery-heading">
      <h1>Guardian Mastery</h1>
      <details class="rules"><summary>Mastery rules</summary>
        <div><p>Every 10 levels in your lowest class unlocks the next 10 in each class. To lower a class past its current minimum, lower the highest classes first.</p><p id="ceiling"></p></div>
      </details>
    </header>
    <img class="training-scene" src="/mastery-training.png" width="1103" height="176" alt="">
    <p class="save-access" id="access" role="status" hidden></p>
    <p id="loading" role="status">Loading mastery…</p>
    <form id="allocation" hidden>
      <div class="mastery-grid">
        <aside class="class-rail"><h2>Class</h2><div id="classes" role="group" aria-label="Hero class"></div></aside>
        <section class="skill-list" aria-labelledby="skills-heading">
          <header><h2 id="skills-heading">Skills</h2><span id="level-range"></span></header>
          <div id="skills"></div>
        </section>
      </div>
      <footer class="mastery-footer">
        <div class="toolbar">
          <div class="balance"><span class="point-icon" aria-hidden="true"></span><div><span>Mastery points</span><strong id="balance"></strong></div></div>
          <div class="actions"><button type="button" id="reset">Reset all levels</button><button type="button" id="max">Max all levels</button><button type="button" id="undo" disabled>Discard edits</button><button class="apply-button" id="apply" disabled>Apply</button></div>
        </div>
        <div id="review" hidden>
          <dl><div><dt id="delta-label">Point change</dt><dd id="delta"></dd></div><div><dt>After applying</dt><dd id="after"></dd></div></dl>
          <p id="excess" role="status" hidden></p>
          <p id="issue" role="status" hidden></p>
          <button type="button" id="reload" hidden>Reload saved allocation</button>
        </div>
        <p id="message" role="status" hidden></p>
      </footer>
    </form>
  </main>
