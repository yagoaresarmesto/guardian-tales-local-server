<main>
  <section class="banner war-banner" aria-labelledby="page-title">
    <div class="banner-copy">
      <p class="season-status">Season 1 · Local practice</p>
      <h1 id="page-title">Guild <em>Wars</em></h1>
      <p class="war-intro">Practice battles award no score or rewards.</p>
    </div>
    <div class="fortress" aria-hidden="true"><img id="fortress-art" alt="" hidden></div>
  </section>

  <div class="workspace">
    <section class="surface collection" aria-labelledby="settings-title">
      <header class="panel-heading"><span class="section-icon sliders" aria-hidden="true"></span><h2 id="settings-title">Practice settings</h2></header>
      <form id="editor">
        <fieldset id="controls" disabled>
          <legend class="sr">Season settings</legend>
          <fieldset class="presets">
            <legend class="label">Practice presets</legend>
            <button type="button" id="attack-preset">Siege attack</button>
            <button type="button" id="defense-preset">Castle 21 defense</button>
          </fieldset>
          <label class="label" for="phase">Phase</label>
          <select id="phase" required></select>
          <div id="dispute" class="war-fields" hidden>
            <div><label class="label" for="round">Round</label><select id="round"></select></div>
            <div><label class="label" id="castle-label" for="castle">Castle</label><select id="castle"></select></div>
          </div>
          <label class="basic-option"><input type="checkbox" id="skip-basic">Skip the basic-course requirement</label>
          <div class="actions">
            <button type="submit" id="apply">Enable Guild Wars</button>
            <span>Apply outside battle, then fully reopen the game.</span>
          </div>
        </fieldset>
      </form>
      <p id="feedback" role="status" hidden></p>
    </section>

    <aside class="surface inspector" aria-labelledby="status-title">
      <header class="panel-heading">
        <span class="section-icon stack" aria-hidden="true"></span><h2 id="status-title">Saved configuration</h2>
        <button type="button" id="reload" aria-label="Reload saved settings" title="Reload saved settings">↻</button>
      </header>
      <div class="war-summary">
        <strong id="war-status">Loading…</strong>
        <p id="inactive-note" hidden>Raid and DKA use their own calendars.</p>
        <dl id="details" hidden></dl>
        <button type="button" id="disable" hidden>Disable Guild Wars</button>
      </div>
    </aside>
  </div>
</main>
