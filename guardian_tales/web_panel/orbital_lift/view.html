<main>
  <section class="banner"><h1>Orbital <em>Lift</em></h1></section>
  <div class="workspace">
    <aside class="surface inspector" aria-labelledby="progress-heading">
      <header class="panel-heading">
        <span class="section-icon stack" aria-hidden="true"></span>
        <h2 id="progress-heading">Saved progress</h2>
        <button type="button" id="reload" aria-label="Reload saved progress" title="Reload saved progress">↻</button>
      </header>
      <dl class="lift-progress">
        <div><dt>Highest cleared floor</dt><dd id="cleared">—</dd></div>
        <div><dt>Next floor</dt><dd id="next">—</dd></div>
      </dl>
    </aside>
    <section class="surface collection" aria-labelledby="editor-heading">
      <header class="panel-heading"><span class="section-icon sliders" aria-hidden="true"></span><h2 id="editor-heading">Set next floor</h2></header>
      <form id="editor">
        <fieldset id="controls" disabled>
          <label class="label" for="floor">Floor to play</label>
          <input type="number" id="floor" min="1" max="1500" step="1" required aria-describedby="range preview">
          <small id="range">1–1,500</small>
          <p id="preview" aria-live="polite"></p>
          <p id="access" role="status" hidden>Open the standalone inventory dashboard, close Guardian Tales and stop the game backend. Then reload saved progress to enable Apply.</p>
          <div class="actions"><button type="submit" id="apply" disabled>Apply</button></div>
        </fieldset>
      </form>
      <p id="feedback" role="status" hidden></p>
    </section>
  </div>
</main>
