<main>
  <section class="banner arena-banner" aria-labelledby="page-title">
    <img id="arena-art" alt="" hidden>
    <div class="banner-copy">
      <p class="season-status">Practice · No rewards</p>
      <h1 id="page-title">Dungeon Kingdom <em>Arena</em></h1>
    </div>
  </section>
  <div class="workspace">
    <section class="surface collection" aria-labelledby="editor-title">
      <header class="panel-heading">
        <span class="section-icon sliders" aria-hidden="true"></span><h2 id="editor-title">Practice rotation</h2>
      </header>
      <form id="editor">
        <fieldset id="controls" disabled>
          <legend class="sr">Arena settings</legend>
          <label class="label" for="variant">Variant</label>
          <select id="variant" required></select>
          <fieldset class="arena-days">
            <legend class="label">Day and slime</legend>
            <div id="days"></div>
          </fieldset>
          <div class="actions">
            <button id="apply" type="submit">Apply selection</button>
            <span>Reopen the game after applying.</span>
          </div>
        </fieldset>
      </form>
      <p id="feedback" role="status" hidden></p>
    </section>
    <aside class="surface inspector" aria-labelledby="active-title">
      <header class="panel-heading">
        <span class="section-icon stack" aria-hidden="true"></span><h2 id="active-title">Saved selection</h2>
        <button type="button" id="reload" aria-label="Reload saved selection" title="Reload saved selection">↻</button>
      </header>
      <div class="arena-saved">
        <p id="saved-status">Loading selection…</p>
        <div id="saved-encounter" hidden>
          <img class="slime" alt="" hidden>
          <div><strong id="saved-slime"></strong><p id="saved-weakness"></p></div>
        </div>
      </div>
    </aside>
  </div>
</main>
<template id="day-card">
  <span class="day-card">
    <span class="day-number"></span>
    <img class="slime" alt="" hidden>
    <strong></strong>
    <small></small>
  </span>
</template>
