<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Guild Raid · Guardian Tales</title>
  <link rel="stylesheet" href="/raid.css">
  <script src="/raid.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="bar-inner">
    <div class="brand"><span class="crest" aria-hidden="true"></span>Guardian Tales</div>
    <nav class="mode-nav" aria-label="Game mode">
      <a href="/" aria-current="page">Raid</a><a href="/dka">DKA</a>
    </nav>
    <span class="local">Local server</span>
  </div>
</header>
<main>
  <section class="banner" aria-labelledby="page-title">
    <div class="banner-copy">
      <p id="season-status" class="season-status">Loading selection…</p>
      <h1 id="page-title">Guild <em>Raid</em></h1>
      <div id="encounter-detail" class="encounter-detail" aria-live="polite" hidden>
        <span class="sigil" aria-hidden="true"></span>
        <div><p id="encounter-meta"></p><strong id="encounter-name"></strong></div>
      </div>
    </div>
    <div class="battlefield" role="group" aria-label="Active encounters on the raid map">
      <img id="map" alt="" hidden>
      <div id="map-pins"></div>
    </div>
  </section>

  <div class="workspace">
    <section class="surface editor" aria-labelledby="editor-title">
      <header class="panel-heading">
        <span class="section-icon sliders" aria-hidden="true"></span>
        <h2 id="editor-title">Rotation editor</h2>
      </header>
      <form id="editor">
        <fieldset id="controls" disabled>
          <legend class="sr">Raid rotation settings</legend>
          <div class="mode">
            <label><input type="radio" name="mode" value="stock" checked><span>Original season</span></label>
            <label><input type="radio" name="mode" value="custom"><span>Custom lineup</span></label>
          </div>
          <div id="stock">
            <label class="label" for="season">Season</label>
            <select id="season"></select>
            <p class="label subsection">Season encounters</p>
            <ol class="encounters" id="preview"></ol>
          </div>
          <div id="custom" hidden>
            <p class="mode-note" id="base"></p>
            <div class="slot-list" id="slots"></div>
            <div class="hp-field">
              <label class="label" for="hp">HP per bar <small>All four bosses</small></label>
              <input id="hp" type="number" min="1" max="2147483647" step="1" placeholder="Use original HP" inputmode="numeric">
            </div>
          </div>
          <div class="actions">
            <button id="apply" type="submit">Apply rotation</button>
            <span>Reopen the game after applying.</span>
          </div>
        </fieldset>
      </form>
      <p id="feedback" role="status" hidden></p>
    </section>
    <aside class="surface summary" aria-labelledby="lineup-title">
      <header class="panel-heading">
        <span class="section-icon stack" aria-hidden="true"></span>
        <h2 id="lineup-title">Active lineup</h2>
        <button type="button" id="reload" aria-label="Reload active selection" title="Reload active selection">↻</button>
      </header>
      <p class="active-meta" id="active-season">Loading…</p>
      <ol id="active-bosses" class="active-bosses"></ol>
      <div class="active-hp"><span>HP per bar <small>Round 1</small></span><strong id="active-hp">—</strong></div>
    </aside>
  </div>
</main>
</body>
</html>
